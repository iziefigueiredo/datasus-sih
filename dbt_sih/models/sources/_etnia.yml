version: 2

sources:
  - name: main
    schema: main
    tags: ['t1']
    tables:
      - name: etnia
        
        description: >
          Dimensão de etnias indígenas brasileiras. Contém 266 etnias catalogadas
          pela FUNAI/IBGE. Preenchida exclusivamente para pacientes indígenas
          (RACA_COR = '05' na tabela fato). 
          
        columns:
          - name: ETNIA
            description: >
              Código da etnia indígena conforme catalogação FUNAI. 
              Domínio: 1 a 266
            tests:
              - not_null
              - unique
              - dbt_utils.accepted_range:
                  min_value: 1
                  max_value: 264

          - name: DESCRICAO
            description: Descrição textual da etnia indígena conforme FUNAI.
            tests:
              - not_null
              - unique